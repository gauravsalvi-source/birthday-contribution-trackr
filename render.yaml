services:
  - type: web
    name: birthday-contribution-api
    env: node
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node server/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
    healthCheckPath: /api/health
    healthCheckTimeout: 30
    autoDeploy: true
